<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="video-sharingan logo: a red three-tomoe eye">
  <title>video-sharingan</title>
  <defs>
    <radialGradient id="iris" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ff5a4e"/>
      <stop offset="45%" stop-color="#e3172b"/>
      <stop offset="85%" stop-color="#8f0b1a"/>
      <stop offset="100%" stop-color="#4a0610"/>
    </radialGradient>
    <radialGradient id="shine" cx="38%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="tomoe" d="M0 -77 A13.5 13.5 0 1 1 0 -50 Q -27 -49 -47 -40 Q -33 -71 0 -77 Z" fill="#0b0b10"/>
  </defs>
  <circle cx="128" cy="128" r="124" fill="#0b0b10"/>
  <circle cx="128" cy="128" r="110" fill="url(#iris)"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#0b0b10" stroke-width="5"/>
  <circle cx="128" cy="128" r="63.5" fill="none" stroke="#3a050c" stroke-opacity="0.75" stroke-width="2.5"/>
  <g transform="translate(128 128)">
    <g>
      <use href="#tomoe"/>
      <use href="#tomoe" transform="rotate(120)"/>
      <use href="#tomoe" transform="rotate(240)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
    <circle r="21" fill="#0b0b10"/>
    <circle r="21" fill="none" stroke="#ff5a4e" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <ellipse cx="96" cy="84" rx="34" ry="22" fill="url(#shine)"/>
