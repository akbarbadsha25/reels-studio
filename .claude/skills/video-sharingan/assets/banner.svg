<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="video-sharingan: the eye that copies any camera move">
  <title>video-sharingan</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="22%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#e3172b" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e3172b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#ff5a4e"/>
      <stop offset="45%" stop-color="#e3172b"/>
      <stop offset="85%" stop-color="#8f0b1a"/>
      <stop offset="100%" stop-color="#4a0610"/>
    </radialGradient>
    <radialGradient id="shine" cx="38%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="tomoe" d="M0 -77 A13.5 13.5 0 1 1 0 -50 Q -27 -49 -47 -40 Q -33 -71 0 -77 Z" fill="#0b0b10"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff5a4e"/>
    </marker>
  </defs>
  <rect width="1280" height="420" fill="#0b0b10"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- viewfinder brackets -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2">
    <path d="M40 70V40H70"/><path d="M1210 40H1240V70"/><path d="M40 350V380H70"/><path d="M1210 380H1240V350"/>
  </g>
  <text x="76" y="62" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" fill="#ff5a4e">● REC  24 fps  1920×1080</text>
  <text x="1204" y="62" text-anchor="end" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" fill="#ffffff" fill-opacity="0.5">TC 00:00:03:12</text>

  <!-- the eye -->
  <g transform="translate(280 210) scale(1.18)">
    <circle r="124" fill="#0b0b10"/>
    <circle r="110" fill="url(#iris)"/>
    <circle r="110" fill="none" stroke="#0b0b10" stroke-width="5"/>
    <circle r="63.5" fill="none" stroke="#3a050c" stroke-opacity="0.75" stroke-width="2.5"/>
    <g>
      <use href="#tomoe"/>
      <use href="#tomoe" transform="rotate(120)"/>
      <use href="#tomoe" transform="rotate(240)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </g>
    <circle r="21" fill="#0b0b10"/>
    <ellipse cx="-32" cy="-44" rx="34" ry="22" fill="url(#shine)"/>
  </g>
  <!-- tracking crosshair + measured trajectory -->
  <g stroke="#ff5a4e" stroke-width="1.5" fill="none" stroke-opacity="0.8">
    <circle cx="280" cy="210" r="168" stroke-dasharray="3 9"/>
    <path d="M100 210H130M430 210H460M280 30V60M280 360V390"/>
  </g>

  <!-- title -->
  <text x="520" y="178" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">video-<tspan fill="#ff3b3b">sharingan</tspan></text>
  <text x="522" y="222" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#ffffff" fill-opacity="0.78">The eye that copies any camera move. In numbers.</text>

  <!-- measurement readout -->
  <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="16">
    <rect x="520" y="252" width="690" height="104" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="540" y="282" fill="#ffffff" fill-opacity="0.55">shot 3 · 4.63 s</text>
    <text x="700" y="282" fill="#ffffff">truck-right + push-in</text>
    <text x="540" y="310" fill="#ff5a4e">53.1 px/s</text><text x="660" y="310" fill="#ffffff" fill-opacity="0.8">2.76 %W/s</text>
    <text x="800" y="310" fill="#ff5a4e">+1.21 %/s</text><text x="920" y="310" fill="#ffffff" fill-opacity="0.8">ease: linear</text>
    <text x="540" y="338" fill="#7ee08a">✓ never stops</text><text x="700" y="338" fill="#7ee08a">✓ no pull-out</text><text x="860" y="338" fill="#7ee08a">✓ cut mid-move</text><text x="1030" y="338" fill="#ffffff" fill-opacity="0.55">120 BPM</text>
  </g>
  <path d="M1100 300 Q1140 280 1188 292" stroke="#ff5a4e" stroke-width="2" fill="none" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
</svg>
